{% extends "base.html" %}
{% block title %}New Issue - HelpDeskLite{% endblock %}
{% block content %}
<h1>New Issue</h1>
<form class="stacked-form" method="post">
  <label>Title <input name="title" required></label>
  <label>Reporter <input name="reporter_name" required></label>
  <label>Priority
    <select name="priority">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
      <option value="urgent">Urgent</option>
    </select>
  </label>
  <label>Description <textarea name="description" rows="8" required></textarea></label>
  <button type="submit">Create Issue</button>
</form>
{% endblock %}
